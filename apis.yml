name: Sky Mavis
description: >-
  Sky Mavis is the studio behind Axie Infinity and Ronin, an EVM blockchain
  crafted for developers building games with player-owned economies. Its
  developer platform exposes a set of API-gateway products for building on
  Ronin: the Skynet Web3 API (query accounts, NFTs, tokens, blocks, contracts
  and transactions), a Ronin JSON-RPC API for node connectivity, the Axie
  Infinity Origins and AXP game-data APIs, Ronin Market and Ronin Store partner
  APIs, and Ronin Waypoint, an OAuth2/OIDC account service and keyless wallet
  for game onboarding. Access to gateway products is authenticated with an
  X-API-KEY issued from the Ronin Developer Console, while public JSON-RPC and
  the Waypoint OIDC surface are openly reachable. Official SDKs ship for
  JavaScript/TypeScript, Unity, Android and iOS.
