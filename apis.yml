apis:
- name: Ronin Skynet Web3 API
  description: >-
    REST Web3 data API on the Ronin blockchain — query accounts, NFTs, tokens,
    collections, blocks, smart contracts and transactions. Authenticated with an
    X-API-KEY issued from the Ronin Developer Console.
  humanURL: https://docs.skymavis.com/api/web3/skynet-web-3-api
