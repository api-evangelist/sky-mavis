    url: authentication/sky-mavis-authentication.yml
  - type: Conventions
    url: conventions/sky-mavis-conventions.yml
- name: Ronin JSON-RPC API
  description: >-
    Ethereum-compatible JSON-RPC endpoint for the Ronin network — read chain
    state, submit transactions, call contracts, and subscribe to events. The
    public mainnet endpoint is openly reachable; gateway JSON-RPC requires an
    X-API-KEY.
  humanURL: https://docs.skymavis.com/api/rpc/ronin-json-rpc
  baseURL: https://api.roninchain.com/rpc
  tags:
  - JSON-RPC
  - Blockchain
  - EVM
- name: Ronin Waypoint Account Service
  description: >-
    OAuth2 / OpenID Connect account service and keyless wallet for onboarding
    players into Ronin games. Discovery is published at the athena.skymavis.com
    issuer; supports authorization_code, client_credentials, refresh_token and
    implicit grants with PKCE.
  humanURL: https://docs.skymavis.com/mavis/ronin-waypoint/overview
  baseURL: https://athena.skymavis.com
  tags:
  - OAuth
  - OpenID Connect
  - Wallet
  properties:
  - type: OAuthScopes
    url: scopes/sky-mavis-scopes.yml
